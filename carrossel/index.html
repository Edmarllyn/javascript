<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Cards</title>
    <!-- Incluir o css do slick carousel, essencial para o estilo do carrosel -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel">
        <div class="card">
            <h3>Card 1</h3>
            <p>Descrição do card 1.</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>Descrição do card 2.</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>Descrição do card 3.</p>
        </div>

        <div class="card">
            <h3>Card 4</h3>
            <p>Descrição do card 4.</p>
        </div>
        <div class="card">
            <h3>Card 5</h3>
            <p>Descrição do card 5.</p>
        </div>
    </div>

    <!--Inclui jQuery (biblioteca de javascript que simplifica o codigo)-->
    <!--jQuery é necessário para o slick carousel funcionar, por isso deve ser adicionado antes-->
    <!--Aqui, usamos o link CDN para obter o jQuery diretamente da web-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Incluir o javascript do slick carousel, que controla a funcionalidade do carrossel-->
    <!--Link CDN do javaScript do slick, essencial para inicializar e consigurar o carrossel-->
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
